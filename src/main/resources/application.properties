spring.application.name=ms-availability
server.port=${SERVER_PORT:8082}

eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka/}
eureka.instance.hostname=${EUREKA_INSTANCE_HOSTNAME:localhost}
eureka.instance.prefer-ip-address=${EUREKA_PREFER_IP:false}

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX:5}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN:1}
spring.datasource.hikari.connection-timeout=${DB_CONNECTION_TIMEOUT:30000}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.properties.hibernate.default_schema=public
spring.jpa.show-sql=${JPA_SHOW_SQL:false}

spring.liquibase.enabled=false

app.pagination.default-size=${PAGINATION_DEFAULT_SIZE:20}
app.pagination.max-size=${PAGINATION_MAX_SIZE:100}

# Log diario en texto plano: logs/ms-availability-YYYY-MM-DD.log (ver logback-spring.xml)
logging.logback.rollingpolicy.max-history=${LOG_MAX_HISTORY:30}
logging.level.com.reservas.availability=INFO

springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=false
app.openapi.server-url=${GATEWAY_PUBLIC_URL:http://localhost:8080}
